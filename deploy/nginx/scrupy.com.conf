# À copier vers /etc/nginx/sites-available/scrupy.com
# puis : sudo nginx -t && sudo systemctl reload nginx

# Site vitrine (placeholder tant que le frontend n’est pas exposé ici)
server {
    listen 443 ssl;
    server_name scrupy.com;

    ssl_certificate /etc/letsencrypt/live/scrupy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scrupy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# API Symfony (conteneur Docker, port hôte 8001)
server {
    listen 443 ssl;
    server_name api.scrupy.com;

    ssl_certificate /etc/letsencrypt/live/scrupy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scrupy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 32M;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name scrupy.com api.scrupy.com;
    return 301 https://$host$request_uri;
}
