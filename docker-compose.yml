# Secrets : copier .env.example en .env et remplir les valeurs.
# NE JAMAIS commiter le fichier .env (il est dans .gitignore).

services:
  database:
    image: mariadb:10.11
    container_name: stf_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-stf_db}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    ports:
      - "3312:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - stf_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stf_backend
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/var/cache
      - /var/www/html/var/log
      - ${APP_UPLOADS_PATH:-./backend/data/uploads}:/var/www/uploads
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - APP_UPLOADS_PATH=/var/www/uploads
      - DATABASE_URL=mysql://${MARIADB_USER}:${MARIADB_PASSWORD}@database:3306/${MARIADB_DATABASE:-stf_db}?serverVersion=mariadb-10.11.0
      - APP_SECRET=${APP_SECRET}
      - MAILER_DSN=${MAILER_DSN}
    command: ["./start-server.sh"]
    depends_on:
      - database
    networks:
      - stf_network

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stf_scheduler
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/var/cache
      - /var/www/html/var/log
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - DATABASE_URL=mysql://${MARIADB_USER}:${MARIADB_PASSWORD}@database:3306/${MARIADB_DATABASE:-stf_db}?serverVersion=mariadb-10.11.0
      - APP_SECRET=${APP_SECRET}
    command: >
      sh -c "
        echo 'Scheduler démarré. Exécution toutes les minutes...' &&
        while true; do
          php bin/console app:process-scheduled-pauses || true
          sleep 60
        done
      "
    depends_on:
      - database
      - backend
    networks:
      - stf_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stf_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app:delegated
      - /app/node_modules
      - /app/.next
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WDS_SOCKET_HOST=0.0.0.0
      - WDS_SOCKET_PORT=3000
      - HOST=0.0.0.0
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:8001
    depends_on:
      - backend
    networks:
      - stf_network

  # Mobile retiré : toujours lancer Expo en local avec "npx expo start --tunnel" pour tests terrain / 5G.
  # Le port 8081 doit rester libre pour Expo.

volumes:
  db_data:

networks:
  stf_network:
    driver: bridge
