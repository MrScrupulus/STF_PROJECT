api_token_refresh:
  path: /api/auth/token/refresh
  methods: [POST]

api_verify_email:
  path: /api/auth/verify-email/{token}
  controller: App\Controller\Security\EmailVerificationController::verifyEmail
  methods: [GET]

app_auth_verify_email:
  path: /auth/verify-email/{token}
  controller: App\Controller\Security\AuthController::verifyEmail
  methods: [POST]

api_route_options:
  path: /{any}
  methods: [OPTIONS]
  requirements:
    any: ".*"

admin_competition_delete:
  path: /admin/competitions/{id}
  controller: App\Controller\Admin\Competition\AdminCompetitionController::delete
  methods: [DELETE]

api_teams:
  path: /teams
  controller: App\Controller\Competition\TeamController::create
  methods: [POST]
