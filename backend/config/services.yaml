parameters:
  app.mailer_from_email: "streetfishingroubaix@gmail.com"
  app.uploads_path.default: "%kernel.project_dir%/data/uploads"
  # URLs utilisées dans les emails (vérification, reset mot de passe). En dev avec téléphone réel, utiliser ngrok (voir .env / EMAIL_LINKS_README).
  app.frontend_url.default: "http://localhost:3000"
  app.backend_url.default: "http://localhost:8001"
  app.frontend_url: "%env(default:app.frontend_url.default:APP_FRONTEND_URL)%"
  app.backend_url: "%env(default:app.backend_url.default:APP_BACKEND_URL)%"

services:
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  App\:
    resource: "../src/"
    exclude:
      - "../src/DependencyInjection/"
      - "../src/Entity/"
      - "../src/Kernel.php"
      - "../src/DTO/"

  # Configuration EmailService
  App\Service\EmailService:
    arguments:
      $mailerFromEmail: "streetfishingroubaix@gmail.com"

  App\Service\CatchPhotoStorageService:
    arguments:
      $uploadsPath: "%env(default:app.uploads_path.default:APP_UPLOADS_PATH)%"
      $uploadsUrlPrefix: "/api/uploads"
      $backendBaseUrl: "%app.backend_url%"

  # CORS Listener
  App\EventListener\CorsListener:
    tags:
      - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 255 }
      - { name: kernel.event_listener, event: kernel.response, method: onKernelResponse, priority: 9999 }
      - { name: kernel.event_listener, event: kernel.exception, method: onKernelException, priority: 10 }

  # JSON 404 Listener - Convertit les 404 en JSON pour les routes API
  App\EventListener\Json404Listener:
    tags:
      - { name: kernel.event_listener, event: kernel.exception, method: onKernelException, priority: 10 }
