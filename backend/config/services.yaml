parameters:
  app.mailer_from_email: "streetfishingroubaix@gmail.com"
  app.frontend_url: "http://localhost:3000"

services:
  _defaults:
    autowire: true # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  App\:
    resource: "../src/"
    exclude:
      - "../src/DependencyInjection/"
      - "../src/Entity/"
      - "../src/Kernel.php"
      - "../src/DTO/"

  # Configuration EmailService
  App\Service\EmailService:
    arguments:
      $mailerFromEmail: "streetfishingroubaix@gmail.com"

  # CORS Listener
  App\EventListener\CorsListener:
    tags:
      - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 255 }
      - { name: kernel.event_listener, event: kernel.response, method: onKernelResponse, priority: 9999 }
